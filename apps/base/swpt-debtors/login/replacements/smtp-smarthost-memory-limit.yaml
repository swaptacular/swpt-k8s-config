source:
  kind: ConfigMap
  name: swpt-login-config
  fieldPath: metadata.annotations.kustomize_smtp_smarthost_memory_limit
targets:
  - select:
      kind: StatefulSet
      name: login-smtp-smarthost
    fieldPaths:
      - spec.template.spec.containers.[name=smtp-smarthost].resources.limits.memory
      - spec.template.spec.initContainers.[name=initialize-postfix-spool].resources.limits.memory
    options:
      create: true

