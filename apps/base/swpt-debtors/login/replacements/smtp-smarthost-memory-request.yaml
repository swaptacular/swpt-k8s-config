source:
  kind: ConfigMap
  name: swpt-login-config
  fieldPath: metadata.annotations.kustomize_smtp_smarthost_memory_request
targets:
  - select:
      kind: StatefulSet
      name: login-smtp-smarthost
    fieldPaths:
      - spec.template.spec.containers.[name=smtp-smarthost].resources.requests.memory
      - spec.template.spec.initContainers.[name=initialize-postfix-spool].resources.requests.memory
    options:
      create: true

