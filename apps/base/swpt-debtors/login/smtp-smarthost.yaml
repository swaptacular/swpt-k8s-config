apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: login-smtp-smarthost
  labels:
    app.kubernetes.io/name: swpt-login
    app.kubernetes.io/component: smtp-smarthost
spec:
  podManagementPolicy: Parallel
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: swpt-login
      app.kubernetes.io/component: smtp-smarthost
  template:
    metadata:
      labels:
        app.kubernetes.io/name: swpt-login
        app.kubernetes.io/component: smtp-smarthost
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: swpt-login
                app.kubernetes.io/component: smtp-smarthost
            topologyKey: kubernetes.io/hostname
      priorityClassName: login-webserver
      imagePullSecrets:
        - name: regcreds
      initContainers:
        - name: initialize-postfix-spool
          image: smtp-smarthost
          command: ["postfix", "check"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - NET_RAW
              - MKNOD
              - SYS_CHROOT
          volumeMounts:
            - name: data
              mountPath: /var/spool/postfix
      containers:
        - name: smtp-smarthost
          image: smtp-smarthost
          ports:
            - name: smtp
              containerPort: 25
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - NET_RAW
              - MKNOD
              - SYS_CHROOT
          readinessProbe:
            tcpSocket:
              port: smtp
            initialDelaySeconds: 5
          envFrom:
            - secretRef:
                name: swpt-login-smtp-smarthost
          volumeMounts:
            - name: data
              mountPath: /var/spool/postfix
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Delete

---
apiVersion: v1
kind: Service
metadata:
  name: login-smtp-smarthost
  labels:
    app.kubernetes.io/name: swpt-login
    app.kubernetes.io/component: smtp-smarthost
spec:
  selector:
    app.kubernetes.io/name: swpt-login
    app.kubernetes.io/component: smtp-smarthost
  ports:
    - name: smtp
      port: 25
      protocol: TCP
      targetPort: smtp

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: login-smtp-smarthost
  labels:
    app.kubernetes.io/name: swpt-login
    app.kubernetes.io/component: smtp-smarthost
spec:
  maxUnavailable: 30%
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: swpt-login
      app.kubernetes.io/component: smtp-smarthost
